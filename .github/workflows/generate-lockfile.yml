name: Generate reviewed UI lockfile
on:
  push:
    paths:
      - ".github/workflows/generate-lockfile.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm dependency lock
        working-directory: apps/ui
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ui/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git commit -m "build(ui): pin transitive dependency graph with npm lockfile"
          git push origin HEAD:main
