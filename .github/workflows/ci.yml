name: Main build and unit tests
on:
  push:
    paths:
      - "apps/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "Directory.Build.props"
      - ".gitignore"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/ui
        run: npm ci --no-audit --no-fund
      - working-directory: apps/ui
        run: npm run lint
      - working-directory: apps/ui
        run: npm test
      - name: Validate shared theme tokens, dialog order and responsive CSS
        run: node tests/UI/Visual/check-design.mjs
      - working-directory: apps/ui
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-ui-dist
          path: apps/ui/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-ui-lock-draft
          path: apps/ui/package-lock.json
          if-no-files-found: error
  windows:
    needs: ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ms001-ui-dist
          path: apps/ui/dist/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build WPF shell
        run: dotnet build apps/desktop/Mosen.GroupScheduler.Desktop.csproj --configuration Release
      - name: Publish offline shell for diagnostic purposes
        run: dotnet publish apps/desktop/Mosen.GroupScheduler.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-step03-desktop-build
          path: artifacts/desktop/
          retention-days: 7
          if-no-files-found: error
  migrations:
    name: SQLite migrations and recovery - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run migration/rollback/backup recovery tests
        run: dotnet run --project tests/Migrations/Mosen.GroupScheduler.Persistence.Tests.csproj --configuration Release
  shell:
    name: Window geometry and shell policy - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test geometry policy and safe window placement
        run: dotnet run --project tests/UI/Shell/Mosen.GroupScheduler.Shell.Tests.csproj --configuration Release
  visual-screenshots:
    name: Visual screenshot smoke on desktop and narrow viewport
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ms001-ui-dist
          path: apps/ui/dist/
      - name: Install Chinese CJK fonts for truthful visual snapshots
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC" | grep -i "NotoSansCJK"
      - name: Capture real Chromium-rendered snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/visual
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME=$(command -v google-chrome)
          elif command -v chromium >/dev/null 2>&1; then
            CHROME=$(command -v chromium)
          else
            echo "No Chromium-based browser available on hosted runner"
            exit 1
          fi
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/ui/dist >/tmp/ms001-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,900 --virtual-time-budget=1200 --screenshot=artifacts/visual/desktop-1440.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=700,900 --virtual-time-budget=1200 --screenshot=artifacts/visual/narrow-700.png http://127.0.0.1:4173/
          test -s artifacts/visual/desktop-1440.png
          test -s artifacts/visual/narrow-700.png
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-step06-visual-snapshots
          path: artifacts/visual/*.png
          retention-days: 7
          if-no-files-found: error
  settings:
    name: Settings SQLite revision and recovery - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run settings concurrency and recovery tests
        run: dotnet run --project tests/Settings/Mosen.GroupScheduler.Settings.Tests.csproj --configuration Release
  security:
    name: DPAPI, redaction and IPC fuzz tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test safe logs, Windows DPAPI and strict local IPC input policy
        run: dotnet run --project tests/Security/Mosen.GroupScheduler.Security.Tests.csproj --configuration Release
  tdlib-adapter:
    name: TDLib JSON transport contract (fake only) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test async response correlation, event ordering and shutdown
        run: dotnet run --project tests/TelegramAdapter/Mosen.GroupScheduler.Telegram.Tests.csproj --configuration Release
  authorization:
    name: Telegram authorization state and wire tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Exercise QR, code, 2FA, email, cancellation and typed TDLib requests
        run: dotnet run --project tests/AccountAuth/Mosen.GroupScheduler.AccountAuth.Tests.csproj --configuration Release
  session-lifecycle:
    name: Account registry, DPAPI vault and connection budget - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test 300 account records, backup, independent keys and fake lifecycle
        run: dotnet run --project tests/SessionLifecycle/Mosen.GroupScheduler.SessionLifecycle.Tests.csproj --configuration Release
  group-catalog:
    name: TDLib group/topic permissions and stable IDs - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test trusted groups, topic closure, account permissions and title rename
        run: dotnet run --project tests/GroupCatalog/Mosen.GroupScheduler.GroupCatalog.Tests.csproj --configuration Release
  script-editor:
    name: Script draft and role editor persistence - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check role-only draft persistence, revision conflicts, reorder and archive
        run: dotnet run --project tests/Scripts/Editor/Mosen.GroupScheduler.ScriptEditor.Tests.csproj --configuration Release
  script-timing-media:
    name: Sequential timing and local image store - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test virtual 30-plus-5 phase ordering and secure image persistence
        run: dotnet run --project tests/Scripts/Timing/Mosen.GroupScheduler.ScriptTiming.Tests.csproj --configuration Release

  script-portable:
    name: Portable ZIP safety and remark matching - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test cross-device archive compatibility, role ambiguity and ZIP attacks
        run: dotnet run --project tests/Scripts/Portable/Mosen.GroupScheduler.ScriptPortable.Tests.csproj --configuration Release

  script-preflight:
    name: Published snapshots and start preflight - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test immutable versions, group permission matrix and frozen bindings
        run: dotnet run --project tests/Preflight/Mosen.GroupScheduler.Preflight.Tests.csproj --configuration Release

  virtual-scheduler:
    name: Fair 50-group scheduler and fail-closed recovery - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test virtual clocks, pause/resume, progress isolation and SQLite restart guard
        run: dotnet run --project tests/Scheduler/Mosen.GroupScheduler.Scheduler.Tests.csproj --configuration Release

  outbound-policy:
    name: Account serialization, flood wait and chat policy - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Validate 50-group concurrency, strict permissions and official rate wait
        run: dotnet run --project tests/Policy/Mosen.GroupScheduler.Policy.Tests.csproj --configuration Release

  delivery-dedup:
    name: Durable receipt matching and crash-safe de-duplication - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify reordered callbacks, duplicate receipts, network uncertainty and restart quarantine
        run: dotnet run --project tests/Delivery/Mosen.GroupScheduler.Delivery.Tests.csproj --configuration Release

  recovery-safety:
    name: Crash, network and sleep recovery with corruption isolation - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check persistent quarantine, offline holds and manual recovery barriers
        run: dotnet run --project tests/Recovery/Mosen.GroupScheduler.Recovery.Tests.csproj --configuration Release

  runtime-dashboard:
    name: Offline runtime dashboard and 50-row read model - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify durable read-only 50-task summaries, completion and repeated refresh
        run: dotnet run --project tests/UI/Dashboard/Mosen.GroupScheduler.Dashboard.Tests.csproj --configuration Release
