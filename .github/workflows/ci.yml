name: Main build and unit tests
on:
  push:
    paths:
      - "apps/**"
      - "src/**"
      - "tests/**"
      - "license/**"
      - "installer/**"
      - "updater/**"
      - "build/**"
      - ".github/workflows/release.yml"
      - "assets/branding/**"
      - ".github/workflows/ci.yml"
      - "Directory.Build.props"
      - ".gitignore"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ms001-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/ui
        run: npm ci --no-audit --no-fund
      - working-directory: apps/ui
        run: npm run lint
      - working-directory: apps/ui
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate transparent real app ICO and PNG on build runner
        run: |
          python -m pip install --disable-pip-version-check pillow cairosvg
          python tools/branding/build_icons.py
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-app-icons
          path: assets/branding/generated/
          if-no-files-found: error
      - name: Validate shared theme tokens, dialog order and responsive CSS
        run: node tests/UI/Visual/check-design.mjs
      - working-directory: apps/ui
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-ui-dist
          path: apps/ui/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-ui-lock-draft
          path: apps/ui/package-lock.json
          if-no-files-found: error
  windows:
    needs: ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ms001-ui-dist
          path: apps/ui/dist/
      - uses: actions/download-artifact@v4
        with:
          name: ms001-app-icons
          path: assets/branding/generated/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build WPF shell
        run: dotnet build apps/desktop/Mosen.GroupScheduler.Desktop.csproj --configuration Release
      - name: Publish offline shell for diagnostic purposes
        run: dotnet publish apps/desktop/Mosen.GroupScheduler.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-step03-desktop-build
          path: artifacts/desktop/
          retention-days: 7
          if-no-files-found: error
  migrations:
    name: SQLite migrations and recovery - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run migration/rollback/backup recovery tests
        run: dotnet run --project tests/Migrations/Mosen.GroupScheduler.Persistence.Tests.csproj --configuration Release
  shell:
    name: Window geometry and shell policy - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test geometry policy and safe window placement
        run: dotnet run --project tests/UI/Shell/Mosen.GroupScheduler.Shell.Tests.csproj --configuration Release
  visual-screenshots:
    name: Visual screenshot smoke on desktop and narrow viewport
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ms001-ui-dist
          path: apps/ui/dist/
      - name: Install Chinese CJK fonts for truthful visual snapshots
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC" | grep -i "NotoSansCJK"
      - name: Capture real Chromium-rendered snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/visual
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME=$(command -v google-chrome)
          elif command -v chromium >/dev/null 2>&1; then
            CHROME=$(command -v chromium)
          else
            echo "No Chromium-based browser available on hosted runner"
            exit 1
          fi
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/ui/dist >/tmp/ms001-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,900 --virtual-time-budget=1200 --screenshot=artifacts/visual/desktop-1440.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=700,900 --virtual-time-budget=1200 --screenshot=artifacts/visual/narrow-700.png http://127.0.0.1:4173/
          test -s artifacts/visual/desktop-1440.png
          test -s artifacts/visual/narrow-700.png
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-step06-visual-snapshots
          path: artifacts/visual/*.png
          retention-days: 7
          if-no-files-found: error
  settings:
    name: Settings SQLite revision and recovery - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run settings concurrency and recovery tests
        run: dotnet run --project tests/Settings/Mosen.GroupScheduler.Settings.Tests.csproj --configuration Release
  security:
    name: DPAPI, redaction and IPC fuzz tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test safe logs, Windows DPAPI and strict local IPC input policy
        run: dotnet run --project tests/Security/Mosen.GroupScheduler.Security.Tests.csproj --configuration Release
  tdlib-adapter:
    name: TDLib JSON transport contract (fake only) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test async response correlation, event ordering and shutdown
        run: dotnet run --project tests/TelegramAdapter/Mosen.GroupScheduler.Telegram.Tests.csproj --configuration Release
  authorization:
    name: Telegram authorization state and wire tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Exercise QR, code, 2FA, email, cancellation and typed TDLib requests
        run: dotnet run --project tests/AccountAuth/Mosen.GroupScheduler.AccountAuth.Tests.csproj --configuration Release
  session-lifecycle:
    name: Account registry, DPAPI vault and connection budget - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test 300 account records, backup, independent keys and fake lifecycle
        run: dotnet run --project tests/SessionLifecycle/Mosen.GroupScheduler.SessionLifecycle.Tests.csproj --configuration Release
  group-catalog:
    name: TDLib group/topic permissions and stable IDs - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test trusted groups, topic closure, account permissions and title rename
        run: dotnet run --project tests/GroupCatalog/Mosen.GroupScheduler.GroupCatalog.Tests.csproj --configuration Release
  script-editor:
    name: Script draft and role editor persistence - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check role-only draft persistence, revision conflicts, reorder and archive
        run: dotnet run --project tests/Scripts/Editor/Mosen.GroupScheduler.ScriptEditor.Tests.csproj --configuration Release
  script-timing-media:
    name: Sequential timing and local image store - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test virtual 30-plus-5 phase ordering and secure image persistence
        run: dotnet run --project tests/Scripts/Timing/Mosen.GroupScheduler.ScriptTiming.Tests.csproj --configuration Release

  script-portable:
    name: Portable ZIP safety and remark matching - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test cross-device archive compatibility, role ambiguity and ZIP attacks
        run: dotnet run --project tests/Scripts/Portable/Mosen.GroupScheduler.ScriptPortable.Tests.csproj --configuration Release

  script-preflight:
    name: Published snapshots and start preflight - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test immutable versions, group permission matrix and frozen bindings
        run: dotnet run --project tests/Preflight/Mosen.GroupScheduler.Preflight.Tests.csproj --configuration Release

  virtual-scheduler:
    name: Fair 50-group scheduler and fail-closed recovery - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test virtual clocks, pause/resume, progress isolation and SQLite restart guard
        run: dotnet run --project tests/Scheduler/Mosen.GroupScheduler.Scheduler.Tests.csproj --configuration Release

  outbound-policy:
    name: Account serialization, flood wait and chat policy - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Validate 50-group concurrency, strict permissions and official rate wait
        run: dotnet run --project tests/Policy/Mosen.GroupScheduler.Policy.Tests.csproj --configuration Release

  delivery-dedup:
    name: Durable receipt matching and crash-safe de-duplication - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify reordered callbacks, duplicate receipts, network uncertainty and restart quarantine
        run: dotnet run --project tests/Delivery/Mosen.GroupScheduler.Delivery.Tests.csproj --configuration Release

  recovery-safety:
    name: Crash, network and sleep recovery with corruption isolation - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check persistent quarantine, offline holds and manual recovery barriers
        run: dotnet run --project tests/Recovery/Mosen.GroupScheduler.Recovery.Tests.csproj --configuration Release

  runtime-dashboard:
    name: Offline runtime dashboard and 50-row read model - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify durable read-only 50-task summaries, completion and repeated refresh
        run: dotnet run --project tests/UI/Dashboard/Mosen.GroupScheduler.Dashboard.Tests.csproj --configuration Release

  notifications-stop:
    name: Deduplicated Windows alerts and global emergency stop policy - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test 50-group atomic emergency stop, history, deduplication and fail-closed disk errors
        run: dotnet run --project tests/Notifications/Mosen.GroupScheduler.Notifications.Tests.csproj --configuration Release

  history-security:
    name: 100k-row history timeline, retention and sanitized export - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify 100k-row SQLite event timeline, support ZIP and retention
        run: dotnet run --project tests/History/Mosen.GroupScheduler.History.Tests.csproj --configuration Release

  performance-budget:
    name: Eight-hour accelerated resource trend, bounded LRU and leak guards - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify 28800 logical ticks, CPU/RAM/handles budgets, lifecycle cleanup and cache/log ceilings
        run: dotnet run --project tests/Performance/Mosen.GroupScheduler.Performance.Tests.csproj --configuration Release

  telegram-license-worker:
    name: Telegram-only Cloudflare Worker/D1 license contract - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Exercise isolated D1 SQLite, signed leases, card issuance, renewals, disable and concurrent binding
        run: node --test license/tests/license.test.mjs license/tests/security-scan.test.mjs

  telegram-license-client:
    name: Telegram-only signed .NET license verification and fail-closed gate - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify P-256 signed license, anti-replay, 1h offline, revocation and per-install device ID
        run: dotnet run --project tests/Licensing/Mosen.GroupScheduler.Licensing.Tests.csproj --configuration Release

  installer-data:
    name: Install path and safe uninstall regression - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify separate user profile, upgrade preserving secrets and default uninstall
        run: dotnet run --project tests/Installer/Mosen.GroupScheduler.Installer.Tests.csproj --configuration Release
      - name: Static assert stable AppId, WebView2 bundle, icons, shortcuts and explicit purge
        run: node --test tests/Installer/contract.test.mjs

  windows-installer:
    name: Unsigned offline Windows Setup with bundled WebView2 - Windows x64
    needs: [ui, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ms001-step03-desktop-build
          path: artifacts/desktop/
      - uses: actions/download-artifact@v4
        with:
          name: ms001-app-icons
          path: assets/branding/generated/
      - name: Download official offline Microsoft WebView2 x64 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "build/vendor" | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2124701" -MaximumRedirection 10 -OutFile "build/vendor/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          $file = "build/vendor/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          if ((Get-Item $file).Length -lt 50MB) { throw "WebView2 installer is unexpectedly small" }
          $signature = Get-AuthenticodeSignature -LiteralPath $file
          if($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "Refusing unsigned or untrusted WebView2 runtime"
          }
      - name: Install Inno Setup 6 on BUILD RUNNER only
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile real offline Windows EXE setup and SHA256
        shell: pwsh
        run: ./build/Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-step27-offline-installer-unsigned
          path: |
            artifacts/installer/MOSEN-Telegram-Scheduler-Setup-0.29.0-dev.exe
            artifacts/installer/MOSEN-Telegram-Scheduler-Setup-0.29.0-dev.exe.sha256
          retention-days: 7
          if-no-files-found: error

  updater-security:
    name: Signed update and resume contract - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test manifest P-256 trust, strict origin, digest and HTTP resume
        run: dotnet run --project tests/Updater/Mosen.GroupScheduler.Updater.Tests.csproj --configuration Release
      - name: Build production signing and release-verification tools
        run: |
          dotnet build updater/ReleaseSigner/Mosen.GroupScheduler.ReleaseSigner.csproj --configuration Release
          dotnet build updater/ReleaseVerifier/Mosen.GroupScheduler.ReleaseVerifier.csproj --configuration Release
      - name: Parse Windows installer, release and rollback PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('build/Build-Installer.ps1','build/New-SignedUpdateManifest.ps1','updater/Apply-Update.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error ($path + ': ' + $_.Message) }
              throw "PowerShell script failed parse check"
            }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure unsigned release cannot escape guarded workflow
        run: node --test tests/Updater/release-contract.test.mjs

  p0-e2e:
    name: Step29 cross-feature offline E2E - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Full P0 export-import-publish-preflight-scheduler-recovery E2E
        run: dotnet run --project tests/E2E/Mosen.GroupScheduler.E2E.Tests.csproj --configuration Release
      - name: Validate P0 mapped coverage, test ownership and risk boundaries
        run: node --test tests/Unit/p0-coverage.test.mjs tests/Integration/ci-contract.test.mjs

  capacity-synthetic:
    name: Step30 300 metadata and 50 offline groups and 72h logical - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Exercise metadata/group capacity and record real process counters
        env:
          MS001_PERF_REPORT: reports/performance/step30-${{ matrix.os }}.json
        run: dotnet run --project tests/Capacity/Mosen.GroupScheduler.Capacity.Tests.csproj -c Release
      - name: Validate truthful resource and capacity report
        env:
          MS001_PERF_REPORT: reports/performance/step30-${{ matrix.os }}.json
        run: node --test tests/Capacity/report-contract.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: step30-synthetic-capacity-${{ matrix.os }}
          path: reports/performance/step30-${{ matrix.os }}.json
          retention-days: 30
          if-no-files-found: error

  security-audit:
    name: Step31 repository secret scan and signed release blockers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Detect committed secrets without printing credential values
        run: node build/audit-repository-secrets.mjs
      - name: Test release approval gate, tracked source and injected secrets
        run: node --test tests/SecurityAudit/release-readiness.test.mjs tests/SecurityAudit/source-audit.test.mjs

  handoff-docs:
    name: Step32 docs, checksum manifest and blocked release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate V1.0 delivery documents and blocked release status
        run: node --test tests/Release/final-handoff.test.mjs
      - name: Create deterministic documentation-only handoff
        run: python build/package-development-handoff.py --output artifacts/handoff
      - name: Independently recheck archive and per-file SHA256
        run: python build/package-development-handoff.py --output artifacts/handoff --verify
      - uses: actions/upload-artifact@v4
        with:
          name: v1-development-handoff
          path: |
            artifacts/handoff/v1-development-handoff.zip
            artifacts/handoff/v1-development-handoff.zip.sha256
            artifacts/handoff/handoff-manifest.json
          retention-days: 30
          if-no-files-found: error

  tdlib-native-smoke:
    name: Win-x64 real TDLib native load and version (no login)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Load actual native tdjson.dll and request TDLib version
        run: dotnet run --project tests/NativeSmoke/Mosen.GroupScheduler.NativeSmoke.csproj --configuration Release --runtime win-x64

  regression-gate:
    name: Step29 aggregate P0 gate - require every upstream CI job success
    needs: [ui, windows, migrations, shell, visual-screenshots, settings, security, tdlib-adapter, authorization, session-lifecycle, group-catalog, script-editor, script-timing-media, script-portable, script-preflight, virtual-scheduler, outbound-policy, delivery-dedup, recovery-safety, runtime-dashboard, notifications-stop, history-security, performance-budget, telegram-license-worker, telegram-license-client, installer-data, windows-installer, updater-security, p0-e2e, capacity-synthetic, security-audit, tdlib-native-smoke, handoff-docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reject cancelled, skipped, failed or missing upstream checks
        env:
          REGRESSION_NEEDS_JSON: ${{ toJson(needs) }}
          REGRESSION_REQUIRED_JOB_IDS: "ui,windows,migrations,shell,visual-screenshots,settings,security,tdlib-adapter,authorization,session-lifecycle,group-catalog,script-editor,script-timing-media,script-portable,script-preflight,virtual-scheduler,outbound-policy,delivery-dedup,recovery-safety,runtime-dashboard,notifications-stop,history-security,performance-budget,telegram-license-worker,telegram-license-client,installer-data,windows-installer,updater-security,p0-e2e,capacity-synthetic,security-audit,tdlib-native-smoke,handoff-docs"
        run: node tests/Integration/verify-ci-needs.mjs
