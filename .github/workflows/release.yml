name: Manual signed Telegram release (draft only)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric release version, e.g. 0.28.0"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ms001-signed-release
  cancel-in-progress: false
jobs:
  build-and-sign:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 90
    environment: telegram-signed-release
    steps:
      - uses: actions/checkout@v4
      - name: Refuse missing signing secrets or untrusted publisher pins
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          UPDATE_SIGNING_PKCS8_BASE64: ${{ secrets.UPDATE_SIGNING_PKCS8_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if($env:RELEASE_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$'){throw "Invalid stable release version"}
          if(-not $env:WINDOWS_SIGNING_PFX_BASE64 -or -not $env:WINDOWS_SIGNING_PFX_PASSWORD -or -not $env:UPDATE_SIGNING_PKCS8_BASE64){throw "Release signing secrets are missing"}
          $pin=(Get-Content -Raw "updater/trust/publisher-thumbprint.txt").Trim()
          $pub=(Get-Content -Raw "updater/trust/release-v1.spki.base64").Trim()
          if($pin -notmatch '^[a-fA-F0-9]{40}$' -or $pub -eq "UNCONFIGURED"){throw "Publisher pins are not configured"}
          $cert=[Security.Cryptography.X509Certificates.X509Certificate2]::new([Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64),$env:WINDOWS_SIGNING_PFX_PASSWORD)
          if($cert.Thumbprint.ToUpperInvariant() -cne $pin.ToUpperInvariant()){throw "PFX does not match publisher thumbprint"}
          # The signer verifies PKCS8/SPKI equality using .NET10 Span APIs before release creation.
          gh release view "v$env:RELEASE_VERSION" --json tagName 2>$null
          if($LASTEXITCODE -eq 0){throw "Release exists; refusing overwrite"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build/test assets and self-contained desktop
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --disable-pip-version-check pillow cairosvg
          python tools/branding/build_icons.py
          Push-Location apps/ui
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
          Pop-Location
          dotnet run --project tests/Updater/Mosen.GroupScheduler.Updater.Tests.csproj -c Release
          dotnet publish apps/desktop/Mosen.GroupScheduler.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:RELEASE_VERSION -o artifacts/desktop
      - name: Code-sign desktop exe and offline installer with pinned publisher certificate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pin=(Get-Content -Raw "updater/trust/publisher-thumbprint.txt").Trim()
          $pfx=Join-Path $env:RUNNER_TEMP "ms001-signer.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            $signtool=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object {$_.FullName -match '\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if(-not $signtool){throw "Missing Windows SDK signtool"}
            $app="artifacts/desktop/Mosen.GroupScheduler.Desktop.exe"
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD $app
            if($LASTEXITCODE -ne 0){throw "Desktop Authenticode signing failed"}
            $a=Get-AuthenticodeSignature $app
            if($a.Status -ne "Valid" -or $a.SignerCertificate.Thumbprint.ToUpperInvariant() -cne $pin.ToUpperInvariant()){throw "Desktop publisher mismatch"}
            New-Item -ItemType Directory -Force "build/vendor" | Out-Null
            Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2124701" -OutFile "build/vendor/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
            $v=Get-Item "build/vendor/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
            $s=Get-AuthenticodeSignature $v.FullName
            if($v.Length -lt 50MB -or $s.Status -ne "Valid" -or $s.SignerCertificate.Subject -notmatch "Microsoft"){throw "Invalid Microsoft runtime"}
            choco install innosetup --yes --no-progress
            ./build/Build-Installer.ps1 -PackageVersion $env:RELEASE_VERSION -PackageFileTag $env:RELEASE_VERSION
            $package="artifacts/installer/MOSEN-Telegram-Scheduler-Setup-$env:RELEASE_VERSION.exe"
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD $package
            if($LASTEXITCODE -ne 0){throw "Setup signing failed"}
            $signed=Get-AuthenticodeSignature $package
            if($signed.Status -ne "Valid" -or $signed.SignerCertificate.Thumbprint.ToUpperInvariant() -cne $pin.ToUpperInvariant()){throw "Setup publisher mismatch"}
            (Get-FileHash $package -Algorithm SHA256).Hash + "  " + (Split-Path $package -Leaf) | Set-Content "$package.sha256" -Encoding ascii
          }finally{if(Test-Path $pfx){Remove-Item -LiteralPath $pfx -Force}}
      - name: Sign update manifest using distinct issuer key
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          UPDATE_SIGNING_PKCS8_BASE64: ${{ secrets.UPDATE_SIGNING_PKCS8_BASE64 }}
        run: |
          $file="artifacts/installer/MOSEN-Telegram-Scheduler-Setup-$env:RELEASE_VERSION.exe"
          ./build/New-SignedUpdateManifest.ps1 -Version $env:RELEASE_VERSION -PackagePath $file -Destination "artifacts/installer/update.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ms001-signed-draft-candidate
          path: |
            artifacts/installer/MOSEN-Telegram-Scheduler-Setup-${{ inputs.version }}.exe
            artifacts/installer/MOSEN-Telegram-Scheduler-Setup-${{ inputs.version }}.exe.sha256
            artifacts/installer/update.json
          retention-days: 2
          if-no-files-found: error

  publish-draft:
    needs: build-and-sign
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: ms001-signed-draft-candidate
          path: artifacts/installer/
      - name: Independently verify signature, digest, cert and exact version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference="Stop"
          $v=$env:RELEASE_VERSION
          $package="artifacts/installer/MOSEN-Telegram-Scheduler-Setup-$v.exe"
          dotnet run --project updater/ReleaseVerifier/Mosen.GroupScheduler.ReleaseVerifier.csproj -c Release -- $v $package "artifacts/installer/update.json"
          if($LASTEXITCODE -ne 0){throw "Signed manifest or package digest verification failed"}
          $certPin=(Get-Content -Raw "updater/trust/publisher-thumbprint.txt").Trim()
          $cert=Get-AuthenticodeSignature $package
          if($cert.Status -ne "Valid" -or $null -eq $cert.SignerCertificate -or
             $cert.SignerCertificate.Thumbprint.ToUpperInvariant() -cne $certPin.ToUpperInvariant()){
            throw "Installer's trusted Authenticode publisher signature failed independent recheck"
          }
          $actual=(Get-FileHash $package -Algorithm SHA256).Hash
          $sum=(Get-Content "artifacts/installer/MOSEN-Telegram-Scheduler-Setup-$v.exe.sha256" -Raw)
          if(-not $sum.StartsWith($actual,[StringComparison]::OrdinalIgnoreCase)){throw "SHA256 checksum file mismatch"}
      - name: Create GitHub Release DRAFT for separate human approval
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=$env:RELEASE_VERSION
          $file="MOSEN-Telegram-Scheduler-Setup-$v.exe"
          gh release view "v$v" --json tagName 2>$null
          if($LASTEXITCODE -eq 0){throw "Release already exists; refusing overwrite"}
          gh release create "v$v" "artifacts/installer/$file" "artifacts/installer/$file.sha256" "artifacts/installer/update.json" --draft --title "MOSEN Telegram Scheduler v$v" --notes "Signed draft awaiting final Win10/11, data migration, TDLib, and human release verification."
